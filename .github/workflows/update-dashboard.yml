name: Обновить дашборд с Яндекс.Диска

on:
  schedule:
    - cron: "0 6 * * *"   # каждый день в 08:00 по времени Калининграда (06:00 UTC)
  workflow_dispatch:       # позволяет запустить вручную кнопкой "Run workflow"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-dashboard:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Получить прямую ссылку через публичный API Яндекс.Диска
        run: |
          curl -sS "https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key=${PUBLIC_KEY}" -o link.json
          echo "--- ответ API ---"
          cat link.json
          HREF=$(jq -r .href link.json)
          if [ -z "$HREF" ] || [ "$HREF" = "null" ]; then
            echo "Не удалось получить ссылку на скачивание" >&2
            exit 1
          fi
          echo "download_href=$HREF" >> "$GITHUB_ENV"
        env:
          PUBLIC_KEY: "https://yadi.sk/d/stoVWKDsxFve7w"

      - name: Скачать дашборд
        run: |
          curl -sSL "$download_href" -o "index.html"
          ls -la
          wc -c "index.html"

      - name: Закоммитить изменения (если файл изменился)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin
          git pull --rebase origin main || true
          git add "index.html"
          if git diff --cached --quiet; then
            echo "Файл не изменился — коммит не нужен"
          else
            git commit -m "Обновление дашборда с Яндекс.Диска ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          fi
          if [ -n "$(git log origin/main..HEAD --oneline 2>/dev/null)" ]; then
            git push origin HEAD:main || { echo "--- push упал, повтор ---"; sleep 5; git pull --rebase origin main; git push origin HEAD:main; }
          else
            echo "Новых коммитов нет"
          fi

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Упаковать сайт для публикации
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
